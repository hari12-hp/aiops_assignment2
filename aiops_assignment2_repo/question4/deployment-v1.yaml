

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api
spec:
  replicas: 2
  minReadySeconds: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: spam-api

  template:
    metadata:
      labels:
        app: spam-api

    spec:
      containers:
        - name: api
          image: aiops-spam-api:k8s-v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
            limits:
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: spam-api
spec:
  type: ClusterIP

  selector:
    app: spam-api

  ports:
    - port: 8000
      targetPort: 8000