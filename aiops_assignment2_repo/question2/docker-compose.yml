services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    image: aiops-spam-api:q2
    ports:
      - "8001:8000"
    depends_on:
      cache:
        condition: service_healthy

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
